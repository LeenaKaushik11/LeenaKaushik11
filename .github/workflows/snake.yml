name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#101010&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&hide_progress=true
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&hide_progress=true

      # Slow down the animation duration in the generated SVG files by 2x
      - name: Slow down animation speed
        run: |
          for f in dist/*.svg; do
            # Scales CSS animation-duration (e.g. from ~8s to 16s)
            sed -i -E 's/animation-duration:\s*([0-9.]+)s/animation-duration: calc(\1s * 2)/g' "$f" || true
          done

      - name: Push generated SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
